[project]
name = "pig-farm-project"
version = "0.1.0"
description = "An ERP to track all possible records for my Pig Farm"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt==4.0.1",
    "fastapi[standard]>=0.135.1",
    "pandas>=3.0.1",
    "passlib[bcrpt,bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.3",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.37",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 88

target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "SIM", "B", "UP"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Cookie",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.File",
    "fastapi.Path",
    "fastapi.Security",
    "fastapi.params.Depends",
    ]

[tool.ruff.format]
quote-style = "double"
